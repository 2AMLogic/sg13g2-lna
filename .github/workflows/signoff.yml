name: signoff

# T1 verdict-of-record gate — see signoff/README.md for the full
# contract. This job re-renders the klt signoff tier report from the
# committed block manifest and the vendored design-evidence-tiers doc,
# then fails on any byte-drift against signoff/t1-report.json, so a
# manifest citation whose artifact has since changed fails rather than
# rotting (issue #30).
#
# Headless and PDK-free like the repo's other checks: `klt signoff
# --manifest` on the current manifest grades only committed files, so
# this runner needs nothing but bash, python3 (stdlib) and the pinned
# klt wheel. It never mints evidence — refreshing the record is a
# deliberate developer action, never a CI side effect.
#
# Exit-code contract (klt docs/cli/signoff.md): 0 = all T1 items met,
# 3 = ran successfully with at least one unmet item. Both are clean runs;
# an all-unmet report is a correct verdict, not a CI failure. The
# checker self-test runs first — a drift gate that cannot fail is
# indistinguishable from no gate at all.
#
# The same check-signoff.sh also runs the layout-citation scope guard
# (check-signoff-scope.py, issue #80): a met layout/DRC/LVS row may not be
# backed by evidence for a partial cell.
#
# Sibling jobs: `reduction-tests` (lna-characterization unit tests),
# `hbt-reduction-tests` (hbt-characterization fixed-T0 NF re-derivation unit
# tests and committed-record replay — issue #101),
# `envelope-replay` (core-envelope derivation replayed against retained data),
# `record-citations` (cited record ids resolve to committed evidence),
# `netlist-freshness` (design/lna.sch device inventory vs the committed
# netlist — issue #88),
# `layout-freshness` (committed layout GDS, provenance, LVS reference and
# klt report envelopes agree with each other and the netlist — issue #86) and
# `model-provenance` (vendored sim/models/ files still match the sha256 stamped
# in sim/models/SOURCE.md — issue #84),
# `sim-append-only` (pull requests only; fails a PR that modifies,
# deletes or renames any committed file under sim/*/records/,
# sim/*/netlist-snapshots/ or sim/*/corners/ — issue #67).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned klt
        run: python3 -m pip install "klayout-tools==0.7.0"

      - name: Grader pin matches the layout flow's klt release
        run: .github/scripts/check-klt-pin.sh

      - name: Drift-checker self-test
        run: .github/scripts/test-check-signoff.sh

      - name: T1 verdict of record is current
        run: .github/scripts/check-signoff.sh

  # Unit tests for the lna-characterization result-reduction code (issue
  # #64). Stdlib-only, headless, PDK-free, single process: no ngspice, no
  # parallelism. Tests only read committed files; sim/ stays append-only.
  reduction-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: lna-characterization reduction unit tests
        run: python3 -I -m unittest discover -s sim/lna-characterization/tests -v

  # Unit tests for the hbt-characterization fixed-T0 NF re-derivation
  # (rederive_nf_fixed_t0.py, issue #101): hand-computed corrected_nf_db
  # values, validity-box boundaries, a trimmed-fixture end-to-end run and a
  # byte-for-byte replay of the committed correction record into a temp dir.
  # Stdlib-only, headless, PDK-free, single process; never writes under sim/.
  hbt-reduction-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: hbt-characterization reduction unit tests
        run: python3 -I -m unittest discover -s sim/hbt-characterization/tests -v

  # Core-envelope replay (issue #83): re-run the committed, deterministic
  # derivation into a temp path and diff against the committed derived CSV.
  # Stdlib-only, no PDK/ngspice; never writes under sim/*/records/.
  envelope-replay:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Envelope replay checker self-test
        run: python3 -I -m unittest discover -s sim/lna-core-envelope/tests -v

      - name: Committed envelope derivation replays against retained data
        run: python3 -I sim/lna-core-envelope/tests/check_envelope_replay.py

  # Record-id citation gate (issue #75): every sim/ record id cited in
  # tracked docs must resolve to committed evidence or be allowlisted in
  # .github/record-citation-allowlist.txt. Stdlib-only, read-only on sim/.
  record-citations:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Citation-checker self-test
        run: .github/scripts/test-check-record-citations.sh

      - name: Cited record ids resolve to committed evidence
        run: .github/scripts/check-record-citations

  # Netlist freshness (issue #88): the committed design/netlist/lna.spice
  # must list the same devices (names, symbol types, values/params) as
  # design/lna.sch. Inventory check only -- weaker than a true `xschem -n`
  # regeneration (no connectivity, no PDK). Stdlib-only, headless.
  netlist-freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Netlist-freshness checker self-test
        run: .github/scripts/test-check-netlist-freshness.sh

      - name: Committed netlist device inventory matches the schematic
        run: python3 -I .github/scripts/check-netlist-freshness

  # sim/ append-only gate (issue #67): sim/README.md "Append-only rule" —
  # committed evidence under sim/*/{records,netlist-snapshots,corners}/ is
  # never edited or deleted; corrections mint a new record id. Diffs the PR
  # head against its merge base with the base branch; additions pass, M/D/T
  # (renames reported as D) fail. No override. Bash + git only, PDK-free,
  # single process. pull_request only: a push to main has no base to diff.
  sim-append-only:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (full history for the merge base)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append-only checker self-test
        run: .github/scripts/test-check-sim-append-only.sh

      - name: No committed sim/ evidence modified, deleted or renamed
        run: .github/scripts/check-sim-append-only --base "origin/${{ github.base_ref }}"

  # Layout freshness gate (issue #86): committed GDS hash == provenance,
  # LVS reference regenerates byte-identically from the current netlist, and
  # the DRC/LVS report envelopes are pinned to the committed GDS. Bash +
  # python3 stdlib only: no klayout, klt or PDK; GDS regeneration stays out
  # of CI. Read-only on the checkout.
  layout-freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Layout-freshness checker self-test
        run: .github/scripts/test-check-layout-freshness.sh

      - name: Committed layout evidence is fresh
        run: .github/scripts/check-layout-freshness

  # Vendored-model provenance gate (issue #84): every model under sim/models/
  # must still match the sha256 stamped in sim/models/SOURCE.md. A model is
  # changed only by re-stamping it from its master repo. Bash + coreutils only:
  # no network, PDK or simulator. Read-only on the checkout.
  model-provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Model-provenance checker self-test
        run: .github/scripts/test-check-model-sources.sh

      - name: Vendored models match their recorded sha256
        run: sim/models/check_sources.sh
